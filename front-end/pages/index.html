<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>
    
    <link rel="icon" href="../../assets/img/Logo-TaskFlow.png">
    <link rel="stylesheet" href="../css/index.css">
</head>
<body>
    <header>
        <div class="header-logo">
            <img src="../../assets/img/Logo-TaskFlow.png" alt="logo">
            <span>Task Flow</span>
        </div>
        <nav class="nav_header">
            <ul>
                <li>
                    <button id="btn-sair">SAIR</button>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="titulo">
            <h1> 
                Minhas tarefas
            </h1>

            <button id="btn-mostrar-modal" class="btn-modal">Adicionar</button>
        </div>

        <section>
            <div class="tarefas">
                <dialog id="modal">
                    <form>
                        <div class="header-modal">
                            <button type="button" id="close-modal" class="btn-modal">
                                X
                            </button>

                            <div class="modal-data-input">
                                <label for="nome-tarefa">
                                    Nome
                                </label>

                                <input
                                    type="text"
                                    required
                                    id="nome-tarefa"
                                    placeholder="Digite o nome da tarefa"
                                >
                            </div>
                        </div>

                        <div class="modal-data-input">
                            <label for="objetivo-tarefa">
                                Objetivo
                            </label>

                            <input
                                type="text"
                                id="objetivo-tarefa"
                                placeholder="Digite o objetivo da sua tarefa"
                            >
                        </div>
                        
                        <button id="salvar-info-modal" class="btn-modal">
                            Concluído
                        </button>
                    </form>
                </dialog>
            </div>

            <div class="card-relogio">
                <div class="relogio">
                    <svg 
                    fill="none"
                    stroke="black"
                    width="100"
                    height="100"
                    >

                        <!--Círculo maior-->
                        <circle 
                            cx="50" 
                            cy="50" 
                            r="40" 
                            stroke-width="3">
                        </circle>

                        <!--Círculo do centro dos dois ponteiros-->    
                        <circle
                            cx="50.2"
                            cy="50"
                            r="4"
                            fill="black">
                        </circle>

                        <!--Linha diagonal para baixo-->
                        <line
                            x1="50"
                            y1="50"
                            x2="68"
                            y2="68"
                            stroke-width="1.5">
                        </line>

                        <!--Linha central apontada para cima-->
                        <line
                            x1="50"
                            y1="20"
                            x2="50"
                            y2="50"
                            stroke-width="1.5">
                        </line>
                    </svg>

                    <span>Ainda não foi adicionada nenhuma tarefa!</span>
                </div>
            </div>
            
        </section>
    </main>

    <script src="../../back-end/modal/funcionalidades.js"></script>
</body>
</html>
