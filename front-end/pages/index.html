<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>
    
    <link rel="icon" href="../../assets/img/Logo-TaskFlow.png">
    <link rel="stylesheet" href="../css/index.css">
</head>
<body>
    <header>
        <div class="header-logo">
            <img src="../../assets/img/Logo-TaskFlow.png" alt="logo">
            <span>Task Flow</span>
        </div>
        <nav class="nav_header">
            <ul>
                <li>
                    <button id="btn-sair">SAIR</button>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="titulo">
            <h1> 
                Minhas tarefas
            </h1>

            <button id="btn-mostrar-modal" class="btn-abrir-modal">Adicionar</button>
        </div>

        <section>
            <div class="tarefas">
                <dialog id="escolher-modal" class="modal">

                    <div class="header-modal">
                        <button type="button" class="btn-close-modal">
                                X
                        </button>
                    </div>

                    <div class="modal-body">
                        <select id="opcoes">
                            <option value="" selected disabled>Selecione</option>
                            <option value="modal-habito">Hábito</option>
                            <option value="modal-tarefa">Tarefa</option>
                        </select>
                    </div>

                    <div class="footer-modal">
                        <button id="continuar-modal">
                            Continuar
                        </button>
                    </div>
                </dialog>

                <dialog id="modal-habito" class="modal">

                    <div class="header-modal">
                        <button type="button" class="btn-close-modal">
                                X
                        </button>
                    </div>

                    <div class="body-modal">
                        <div class="modal-data-input">
                            <label for="nome-tarefa">
                                Nome
                            </label>

                            <input
                                type="text"
                                required
                                id="nome-tarefa"
                                placeholder="Digite o nome do habito..."
                            >
                        </div>

                        <div class="modal-data-input">
                            <label for="objetivo-tarefa">
                                    Objetivo
                            </label>

                            <textarea
                                id="objetivo-tarefa"
                                placeholder="O que te motivou a começar..."
                            ></textarea>
                        </div>
                    </div>

                    <div class="footer-modal">
                        <button id="salvar-habito">
                            Salvar
                        </button>
                    </div>

                </dialog>

                <dialog id="modal-tarefa" class="modal">
                    <form>
                        
                    </form>
                </dialog>
            </div>

            <div class="card-relogio">
                <div class="relogio">
                    <svg 
                    fill="none"
                    stroke="black"
                    width="100"
                    height="100"
                    >

                        <!--Círculo maior-->
                        <circle 
                            cx="50" 
                            cy="50" 
                            r="40" 
                            stroke-width="3">
                        </circle>

                        <!--Círculo do centro dos dois ponteiros-->    
                        <circle
                            cx="50.2"
                            cy="50"
                            r="4"
                            fill="black">
                        </circle>

                        <!--Linha diagonal para baixo-->
                        <line
                            x1="50"
                            y1="50"
                            x2="68"
                            y2="68"
                            stroke-width="1.5">
                        </line>

                        <!--Linha central apontada para cima-->
                        <line
                            x1="50"
                            y1="20"
                            x2="50"
                            y2="50"
                            stroke-width="1.5">
                        </line>
                    </svg>

                    <span>Ainda não foi adicionada nenhuma tarefa!</span>
                </div>
            </div>
            
        </section>
    </main>

    <footer>
        <p>
            &copy; 2026 - Task Flow.
        </p>
    </footer>

    <script src="../../back-end/modal/funcionalidades/abrir-fechar.js"></script>
    <script src="../../back-end/modal/funcionalidades/trocar-modal.js"></script>
</body>
</html>
