<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>
    
    <link rel="icon" href="../../assets/img/Logo-TaskFlow.png">
    <link rel="stylesheet" href="../css/index.css">
</head>
<body>
    <header class="header-page">
        <div class="header-logo">
            <img src="../../assets/img/Logo-TaskFlow.png" alt="logo">
            <span>Task Flow</span>
        </div>
        <nav class="nav_header">
            <ul>
                <li>
                    <button id="btn-sair">SAIR</button>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="titulo">
            <h1> 
                Minhas tarefas
            </h1>

            <div class="funcoes">
                <div class="botoes">
                    <button id="btn-mostrar-modal" class="btn-titulo">
                        Adicionar
                    </button>

                    <button id="btn-relatorio" class="btn-titulo">
                        Gerar Relatório
                    </button>
                </div>

                <div>
                    <select id="filtro-status" class="filtro">
                        <option value="" option disabled>FILTRO</option>
                        <option value="todos">Todas as tarefas</option>
                        <option value="pendente">Pendentes</option>
                        <option value="concluido">Concluídas</option>
                        <option value="atrasada">Atrasadas</option>
                    </select>
                </div>
            </div>
        </div>

        <article class="tarefas">
                <dialog id="modal-tarefa" class="modal">
                    <div class="header-modal">
                            <button type="button" class="btn-close-modal">
                                    X
                            </button>
                        </div>

                        <div class="body-modal">
                            <div class="modal-data-input">
                                <label for="nome_tarefa">
                                    Nome
                                </label>

                                <input
                                    type="text"
                                    id="nome_tarefa"
                                    placeholder="Digite o nome da tarefa..."
                                >
                            </div>

                            <div class="modal-data-input">
                                <Label for="prazo-tarefa">
                                    Prazo
                                </Label>

                                <input 
                                    type="date"
                                    id="prazo-tarefa"
                                    required
                                >
                            </div>
                            <div class="modal-data-input">
                                <label for="descricao_tarefa">
                                        Descreva sua tarefa
                                </label>

                                <textarea
                                    id="descricao_tarefa"
                                    placeholder="O que te motivou a começar..."
                                ></textarea>
                            </div>
                        </div>

                        <div class="footer-modal">
                            <button id="salvar-tarefa" class="salvar-dialog">
                                Salvar
                            </button>
                        </div>
                </dialog>    
        </article>

        <section class="conteudo-task" id="conteudo-task">
        </section>

        <div class="card-relogio" id="card-relogio">
            <div class="relogio">
                <svg 
                    fill="none"
                    stroke="black"
                    width="100"
                    height="100"
                >
                    <!--Círculo maior-->
                    <circle 
                        cx="50" 
                        cy="50" 
                        r="40" 
                        stroke-width="3">
                    </circle>

                    <!--Círculo do centro dos dois ponteiros-->    
                    <circle
                        cx="50.2"
                        cy="50"
                        r="4"
                        fill="black">
                    </circle>

                    <!--Linha diagonal para baixo-->
                    <line
                        x1="50"
                        y1="50"
                        x2="68"
                        y2="68"
                        stroke-width="1.5">
                    </line>

                    <!--Linha central apontada para cima-->
                    <line
                        x1="50"
                        y1="20"
                        x2="50"
                        y2="50"
                        stroke-width="1.5">
                    </line>
                </svg>

                    <span>
                        Ainda não foi adicionada nenhuma tarefa!
                    </span>
            </div>
        </div>
    </main>

    <footer class="footer-page">
        <p>
            &copy; 2026 - TaskFlow
        </p>
    </footer>

    <script src="../../scripts/modal/abrir-fechar.js" type="module"></script>
    <script src="../../scripts/card/adicionar-card.js" type="module"></script>
    <script src="../../scripts/card/concluir-card.js" type="module"></script>
    <script src="../../scripts/suporte/limitar-dias.js" type="module"></script>
    <script src="../../scripts/card/excluir-card.js" type="module"></script>
    <script src="../../scripts/card/carregar-cards.js" type="module"></script>
    <script src="../../scripts/card/atrasado-card.js" type="module"></script>
    <script src="../../scripts/card/filtro.js" type="module"></script>
    <script src="../../scripts/relatorio.js" type="module"></script>
    <script src="../../scripts/sair.js" type="module"></script>
</body>
</html>
